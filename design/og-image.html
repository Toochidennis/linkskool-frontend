<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1200px; height: 630px; overflow: hidden; }
  body {
    position: relative;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    padding: 76px 80px;
    background: linear-gradient(155deg, #14286e 0%, #17307f 48%, #1b3a9e 100%);
    font-family: Inter, -apple-system, "Helvetica Neue", Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
    color: #fff;
  }
  .grid, .glow { position: absolute; pointer-events: none; }
  .grid {
    inset: 0;
    background-image:
      linear-gradient(to right, rgba(255,255,255,.055) 1px, transparent 1px),
      linear-gradient(to bottom, rgba(255,255,255,.055) 1px, transparent 1px);
    background-size: 68px 68px;
    -webkit-mask-image: radial-gradient(110% 85% at 15% 0%, #000 0%, transparent 72%);
  }
  .glow {
    top: -320px; right: -220px; width: 780px; height: 780px; border-radius: 50%;
    background: radial-gradient(circle, rgba(125,163,255,.26) 0%, rgba(125,163,255,0) 68%);
  }

  .row { position: relative; display: flex; align-items: center; gap: 18px; }
  .chip {
    width: 62px; height: 62px; border-radius: 16px; background: #fff;
    display: flex; align-items: center; justify-content: center;
  }
  .chip img { width: 49px; height: 49px; object-fit: contain; }
  .wordmark { font-size: 33px; font-weight: 600; letter-spacing: -.02em; }

  h1 {
    position: relative;
    max-width: 940px;
    font-size: 74px;
    font-weight: 600;
    line-height: 1.06;
    letter-spacing: -.035em;
  }
  .mark { position: relative; white-space: nowrap; }
  .mark svg {
    position: absolute; left: 0; bottom: -6px; width: 100%; height: .28em; color: #f97316;
  }

  .foot { position: relative; font-size: 21px; color: rgba(255,255,255,.58); letter-spacing: .01em; }
</style>
